name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      server_url:
        description: '临时覆盖服务端地址（一般留空；留空时用仓库 Secrets 里的 TYW_SERVER_URL）'
        required: false
        default: ''

permissions:
  contents: write

env:
  VERSION: '1.1.37'
  # 公开仓库只出正式版 + 快照版。内测版（Beta）只在本地构建，不进开源产物。
  TYW_CHANNELS: 'Release Snapshot'

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    # macos-latest = Apple Silicon（macos-14 标签已退役，写死会直接取消任务）。
    # osx-x64 也在 arm64 机器上交叉发布：
    # 托管代码不需要本地编译，只要下载对应架构的 runtime pack 即可。
    runs-on: macos-latest
    # 服务端地址来自仓库 Secrets 的 TYW_SERVER_URL，源码里不出现
    env:
      TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # .icns 与 zip 打包走 python3（Pillow）。AppIcon.icns 已经入库，
      # 这里装 Pillow 只是为了能干净地重新生成图标；runner 上 pip 可能是
      # externally-managed，装不上也不影响出包，所以允许失败。
      - name: Install Pillow (optional)
        continue-on-error: true
        run: python3 -m pip install --quiet --break-system-packages pillow || true

      - name: Publish channels
        working-directory: TYWLauncher-macOS
        env:
          PYTHON: python3
        run: bash ./packaging/build-macos.sh "$VERSION" ${{ matrix.arch }}

      - name: Verify bundle
        working-directory: TYWLauncher-macOS
        run: |
          set -e
          want='arm64'
          [ "${{ matrix.arch }}" = 'x64' ] && want='x86_64'
          for f in dist/TYWLauncher-macos-*.zip; do
            echo "--- $f"
            unzip -l "$f" | grep -q 'Contents/Info.plist'
          done
          rm -rf /tmp/vfy && mkdir -p /tmp/vfy
          unzip -q "dist/TYWLauncher-macos-${{ matrix.arch }}.zip" -d /tmp/vfy
          file "/tmp/vfy/TYW Launcher.app/Contents/MacOS/TYWLauncher" | tee /tmp/vfy/arch.txt
          grep -q "$want" /tmp/vfy/arch.txt

      - name: Verify dmg
        working-directory: TYWLauncher-macOS
        run: |
          set -e
          # dmg 数量必须等于 zip 数量（两种通道 × 每种一份），不写死 3
          want=$(ls dist/TYWLauncher-macos-*.zip | wc -l | tr -d ' ')
          n=0
          for d in dist/TYWLauncher-macos-*.dmg; do
            [ -f "$d" ] || continue
            echo "--- $d"
            hdiutil verify "$d"
            hdiutil attach -nobrowse -readonly -mountpoint /tmp/dm "$d" >/dev/null
            test -d "/tmp/dm/TYW Launcher.app"
            test -L "/tmp/dm/Applications"
            hdiutil detach /tmp/dm >/dev/null
            n=$((n+1))
          done
          test "$n" -eq "$want"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TYWLauncher-macos-${{ matrix.arch }}
          path: |
            TYWLauncher-macOS/dist/TYWLauncher-macos-*.zip
            TYWLauncher-macOS/dist/TYWLauncher-macos-*.dmg
            TYWLauncher-macOS/dist/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TYWLauncher-macOS/dist/TYWLauncher-macos-*.zip
            TYWLauncher-macOS/dist/TYWLauncher-macos-*.dmg
            TYWLauncher-macOS/dist/SHA256SUMS-macos.txt
          generate_release_notes: true
