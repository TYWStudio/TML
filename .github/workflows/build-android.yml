name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      server_url:
        description: '临时覆盖服务端地址（一般留空；留空时用仓库 Secrets 里的 TYW_SERVER_URL）'
        required: false
        default: ''
      channel:
        description: '只构建哪个通道（手动触发只编译、不发布产物）'
        type: choice
        options: [auto, release, snapshot, both]
        default: auto

permissions:
  contents: write

jobs:
  # 发布裁决：只有打 v* tag 才产出并发布产物，tag 带 -snapshot/-beta 等后缀就出快照版
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      channels: ${{ steps.meta.outputs.channels }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: python3 scripts/release_meta.py --platform android --channel "${{ github.event.inputs.channel || 'auto' }}"

  build:
    name: Android ${{ matrix.channel }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 正式版 tag 只出 release APK，快照版 tag 只出 snapshot APK，普通 push 两个都编译
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Build Scan(R)：自动发布到 scans.gradle.com，无需交互式同意条款
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Build ${{ matrix.channel }}
        id: gradle_build
        working-directory: TYWLauncher-Android
        # BuildConfig.SERVER_ADDRESS 读这个环境变量；地址只存在仓库 Secrets 里
        env:
          TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
          TYW_STORE_API_KEY: ${{ secrets.TYW_STORE_API_KEY }}
          # 发版时把 tag 版本写进 APK；平时留空则用 build.gradle.kts 里的基线
          TYW_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gradle ${{ matrix.task }} --no-daemon --console=plain --scan

      - name: Build Scan link
        if: always()
        run: |
          {
            echo "### Build Scan(R) - ${{ matrix.channel }}"
            if [ -n "${{ steps.gradle_build.outputs.build-scan-url }}" ]; then
              echo "[查看构建扫描](${{ steps.gradle_build.outputs.build-scan-url }})"
            else
              echo "本次构建未生成构建扫描链接。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist
          cp "TYWLauncher-Android/app/build/outputs/apk/${{ matrix.dir }}/${{ matrix.file }}" \
             "dist/${{ matrix.output }}"
          cd dist && sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

      - name: Upload artifact
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/*

      # 只有发布新版本（v* tag）才推下载站：普通 push 不上传，编译/打包任何一步失败也走不到这里。
      # 构建直接挂在该应用下（不属于任何分支项目 = 各处平台共用一处，不占分类）。
      - name: Upload to download site (tag only)
        if: needs.plan.outputs.publish == 'true'
        env:
          TYW_UPLOAD_KEY: ${{ secrets.TYW_UPLOAD_KEY }}
          TYW_UPLOAD_URL: ${{ secrets.TYW_UPLOAD_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          python3 scripts/upload_build.py --platform android --root dist \
            --version "${{ needs.plan.outputs.version }}" --notes "GitHub Actions · android-${{ matrix.channel }}"

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: false
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          name: ${{ needs.plan.outputs.tag }}（${{ needs.plan.outputs.channel == 'snapshot' && '快照版' || '正式版' }}）
