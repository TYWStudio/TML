name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: release
            output: TYWLauncher-android.apk
          - channel: snapshot
            output: TYWLauncher-android-snapshot.apk
          - channel: beta
            output: TYWLauncher-android-beta.apk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ${{ matrix.channel }}
        working-directory: TYWLauncher-Android
        run: |
          gradle assembleRelease -PtywChannel=${{ matrix.channel }} --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p dist
          cp TYWLauncher-Android/app/build/outputs/apk/release/*.apk "dist/${{ matrix.output }}"
          cd dist && sha256sum *.apk > "${{ matrix.output }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: false
