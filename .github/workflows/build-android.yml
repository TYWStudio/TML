name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 公开仓库只出两个通道的 APK；内测版（debug 风格）只在本地构建。
          - channel: release
            task: assembleRelease
            dir: release
            file: TYWLauncher-android.apk
            output: TYWLauncher-android.apk
          - channel: snapshot
            task: assembleSnapshot
            dir: snapshot
            file: TYWLauncher-android-snapshot.apk
            output: TYWLauncher-android-snapshot.apk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ${{ matrix.channel }}
        working-directory: TYWLauncher-Android
        # BuildConfig.SERVER_ADDRESS 读这个环境变量；地址只存在仓库 Secrets 里
        env:
          TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
        run: |
          gradle ${{ matrix.task }} --no-daemon --console=plain

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist
          cp "TYWLauncher-Android/app/build/outputs/apk/${{ matrix.dir }}/${{ matrix.file }}" \
             "dist/${{ matrix.output }}"
          cd dist && sha256sum "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: false
