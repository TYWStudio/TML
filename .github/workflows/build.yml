name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      server_url:
        description: '临时覆盖服务端地址（一般留空；留空时用仓库 Secrets 里的 TYW_SERVER_URL）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 公开仓库只出两个通道：Release=正式版，Snapshot=快照版。
          # 内测版（Debug / Beta）只在本地用 _deploy\build.py 构建，不进开源产物。
          - configuration: Release
            binary: TYW Launcher.exe
            artifact: TYWLauncher-windows-x64
          - configuration: Snapshot
            binary: TYW Launcher Snapshot.exe
            artifact: TYWLauncher-windows-x64-snapshot
    # 服务端地址与 API 密钥都不写在仓库里：CI 在编译前临时注入 ModSecret.vb
    # （scripts/inject_secrets.py），工作区用完即销毁，源码永远只有空值。
    env:
      TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
      PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
      PCL_CURSEFORGE_API_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
      TYW_CLS_URL: ${{ secrets.TYW_CLS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 官方发行包在这里才把地址/密钥填进编译期常量；没有 Secrets 的 fork 保持空值 = 纯离线版
      - name: Inject server url & api keys
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/inject_secrets.py apply

      # 只编客户端工程：解决方案里还挂着 Avalonia 的 Linux/macOS 工程，这里不需要
      - name: Build ${{ matrix.configuration }}
        run: msbuild "TYW Launcher\TYW Launcher.vbproj" /restore /t:Build /p:Configuration=${{ matrix.configuration }} /m /nologo /v:m

      # 服务端地址已经在编译期注入 exe（ModSecret.vb 的 BuiltInServerAddress）。
      # 产物里只有 exe，不再附带任何 server.txt；想换服务端用「设置 → 启动器 → 服务端地址」
      # 或环境变量 TYW_SERVER，都不需要重新编译。
      - name: Package (exe only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "TYW Launcher/bin/${{ matrix.configuration }}/TYW Launcher.exe" "dist/${{ matrix.binary }}"
          if (-not $env:TYW_SERVER_URL) { Write-Host "::warning::未配置 TYW_SERVER_URL，本次产物为离线版" }
          if (Test-Path "$PWD/dist/server.txt") { throw "产物里出现了 server.txt，构建配置有误" }
          Get-ChildItem dist | Format-Table Name,Length | Out-String

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # 两个通道的产物都在同一个 tag 里发，所以汇总后再上传，避免两个 job 抢同一个 Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
