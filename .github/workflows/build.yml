name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      server_url:
        description: '临时覆盖服务端地址（一般留空；留空时用仓库 Secrets 里的 TYW_SERVER_URL）'
        required: false
        default: ''
      channel:
        description: '只构建哪个通道（手动触发只编译、不发布产物）'
        type: choice
        options: [auto, release, snapshot, both]
        default: auto

permissions:
  contents: write

jobs:
  # 发布裁决：只有打 v* tag（发布新版本）才产出并发布产物；
  # tag 带 -snapshot / -beta / -preview 等后缀就出快照版，否则出正式版。
  # 平时 push main 只编译两个通道做验证，不上传 artifact、不发布。
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      channels: ${{ steps.meta.outputs.channels }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: python3 scripts/release_meta.py --platform windows --channel "${{ github.event.inputs.channel || 'auto' }}"

  build:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # 矩阵由 plan 给：正式版 tag 只有 Release，快照版 tag 只有 Snapshot，
      # 普通 push 两个通道都编译（只为验证能编译，产物不外发）。
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # 服务端地址与 API 密钥都不写在仓库里：CI 在编译前临时注入 ModSecret.vb
    # （scripts/inject_secrets.py），工作区用完即销毁，源码永远只有空值。
    env:
      TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
      PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
      PCL_CURSEFORGE_API_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
      TYW_CLS_URL: ${{ secrets.TYW_CLS_URL }}
      TYW_STORE_API_KEY: ${{ secrets.TYW_STORE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 官方发行包在这里才把地址/密钥填进编译期常量；没有 Secrets 的 fork 保持空值 = 纯离线版
      - name: Inject server url & api keys
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/inject_secrets.py apply

      # 只编客户端工程：解决方案里还挂着 Avalonia 的 Linux/macOS 工程，这里不需要
      - name: Build ${{ matrix.configuration }}
        run: msbuild "TYW Launcher\TYW Launcher.vbproj" /restore /t:Build /p:Configuration=${{ matrix.configuration }} /m /nologo /v:m

      # 服务端地址已经在编译期注入 exe（ModSecret.vb 的 BuiltInServerAddress）。
      # 产物里只有 exe，不再附带任何 server.txt；想换服务端用「设置 → 启动器 → 服务端地址」
      # 或环境变量 TYW_SERVER，都不需要重新编译。
      - name: Package (exe only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "TYW Launcher/bin/${{ matrix.configuration }}/TYW Launcher.exe" "dist/${{ matrix.binary }}"
          if (-not $env:TYW_SERVER_URL) { Write-Host "::warning::未配置 TYW_SERVER_URL，本次产物为离线版" }
          if (Test-Path "$PWD/dist/server.txt") { throw "产物里出现了 server.txt，构建配置有误" }
          Get-ChildItem dist | Format-Table Name,Length | Out-String

      - name: Upload artifact
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      # 只有发布新版本（v* tag）才推下载站：普通 push 不上传，编译/打包任何一步失败也走不到这里。
      # 构建直接挂在该应用下（不属于任何分支项目 = 各处平台共用一处，不占分类）。
      - name: Upload to download site (tag only)
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          TYW_UPLOAD_KEY: ${{ secrets.TYW_UPLOAD_KEY }}
          TYW_UPLOAD_URL: ${{ secrets.TYW_UPLOAD_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/upload_build.py --platform windows --root dist \
            --version "${{ needs.plan.outputs.version }}" --notes "GitHub Actions · ${{ matrix.configuration }}"

  # 汇总产物后统一发 Release，避免多个 job 抢同一个 Release
  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          name: ${{ needs.plan.outputs.tag }}（${{ needs.plan.outputs.channel == 'snapshot' && '快照版' || '正式版' }}）
