name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      server_url:
        description: '临时覆盖服务端地址（一般留空；留空时用仓库 Secrets 里的 TYW_SERVER_URL）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 服务端地址不写在仓库里：由仓库 Secrets 的 TYW_SERVER_URL 注入，
    # 手动触发时填的 server_url 优先（方便临时指向别的服务器）。
    env:
      TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
          - arch: arm64
            rid: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish three channels
        working-directory: TYWLauncher-Linux/src
        run: |
          set -e
          for ch in Release Snapshot Beta; do
            dotnet publish TYW.Desktop/TYW.Desktop.csproj \
              -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:TYWChannel=$ch \
              -o "../out/ch-$ch"
          done

      - name: Package tar.gz
        working-directory: TYWLauncher-Linux
        run: |
          set -e
          mkdir -p dist stage
          ARCH=${{ matrix.arch }}
          declare -A NAME=(
            [Release]="TYWLauncher-linux-${ARCH}.tar.gz"
            [Snapshot]="TYWLauncher-linux-${ARCH}-snapshot.tar.gz"
            [Beta]="TYWLauncher-linux-${ARCH}-beta.tar.gz"
          )
          DESKTOP='[Desktop Entry]\nType=Application\nName=TYW Launcher\nGenericName=Minecraft Launcher\nExec=tyw-launcher\nIcon=tyw-launcher\nCategories=Game;\n'
          WRAPPER='#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/TYWLauncher" "$@"\n'
          for ch in Release Snapshot Beta; do
            stage="stage/pkg-$ch/tyw-launcher-1.0.0"
            mkdir -p "$stage"
            cp -a "out/ch-$ch/." "$stage/"
            cp packaging/icons/tyw-256.png "$stage/tyw-launcher.png"
            printf "$DESKTOP" > "$stage/tyw-launcher.desktop"
            printf "$WRAPPER" > "$stage/tyw-launcher"
            chmod +x "$stage/tyw-launcher" "$stage/TYWLauncher"
            # 服务端地址写进包内的 server.txt；地址来自 CI Secrets，仓库里查不到
            if [ -n "${TYW_SERVER_URL:-}" ]; then
              printf '%s\n' "$TYW_SERVER_URL" > "$stage/server.txt"
            fi
            tar -C "stage/pkg-$ch" -czf "dist/${NAME[$ch]}" tyw-launcher-1.0.0
            rm -rf "stage/pkg-$ch"
          done
          (cd dist && sha256sum TYWLauncher-linux-*.tar.gz > SHA256SUMS-linux-${ARCH}.txt)
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TYWLauncher-linux-${{ matrix.arch }}
          path: |
            TYWLauncher-Linux/dist/*.tar.gz
            TYWLauncher-Linux/dist/SHA256SUMS-linux-*.txt
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TYWLauncher-Linux/dist/*.tar.gz
            TYWLauncher-Linux/dist/SHA256SUMS-linux-*.txt
          generate_release_notes: true
