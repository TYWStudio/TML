name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      server_url:
        description: '临时覆盖服务端地址（一般留空；留空时用仓库 Secrets 里的 TYW_SERVER_URL）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    # 用同架构的 runner：AppImage 的打包工具是目标架构的二进制，交叉跑会 exec format error
    runs-on: ${{ matrix.runner }}
    # 服务端地址不写在仓库里：由仓库 Secrets 的 TYW_SERVER_URL 在**编译期**注入
    # ModServerUrl.vb 的 BuiltIn 常量，产物里不放任何 server.txt。
    # 手动触发时填的 server_url 优先（方便临时指向别的服务器）。
    env:
      TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            runner: ubuntu-24.04
          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # dpkg-deb 自带；rpm / zstd / mksquashfs 需要装
      - name: Install packaging tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm zstd squashfs-tools file
          for t in dpkg-deb rpmbuild zstd mksquashfs; do
            printf '%-12s %s\n' "$t" "$(command -v $t || echo 缺失)"
          done

      # 官方发行包在这里才把地址填进编译期常量；没有 Secrets 的 fork 保持空值 = 纯离线版。
      # 必须在 publish 之前执行：地址只存在于编译后的二进制里，五个包都不会带 server.txt。
      - name: Inject server url (compile-time)
        working-directory: TYWLauncher-Linux
        env:
          PYTHONIOENCODING: utf-8
        run: python3 ../scripts/inject_server_url.py --platform linux apply

      # 公开仓库只出正式版 + 快照版；内测版（Beta）只在本地用 build.py 构建
      - name: Publish channels
        working-directory: TYWLauncher-Linux/src
        run: |
          set -e
          for ch in Release Snapshot; do
            echo "::group::publish $ch"
            dotnet publish TYW.Desktop/TYW.Desktop.csproj \
              -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:TYWChannel=$ch \
              -o "../out/ch-$ch"
            echo "::endgroup::"
          done

      # 一次出全部 5 种包：tar.gz / deb / rpm / pkg.tar.zst / AppImage
      # 版本号直接从源码取（ModApp.vb 的 Release 分支），避免和客户端对不上
      # AppImage 的 runtime 已内置在 packaging/runtime/，不需要联网下载
      - name: Package all formats
        working-directory: TYWLauncher-Linux
        run: |
          set -e
          VER="$(sed -n 's/.*Case Else : Return "\([0-9][0-9.]*\)".*/\1/p' src/TYW.Core/Base/ModApp.vb | head -1)"
          [ -n "$VER" ] || { echo '::error::读不到版本号'; exit 1; }
          echo "版本号：$VER"
          for ch in Release Snapshot; do
            echo "::group::package $ch"
            TYW_CHANNEL="$ch" TYW_SRC_DIR="$PWD/out/ch-$ch" \
              bash packaging/build.sh "$VER" ${{ matrix.arch }}
            echo "::endgroup::"
          done
          if [ -n "${TYW_SERVER_URL:-}" ]; then
            echo "服务端地址已在编译期注入二进制（值来自 Secrets，仓库与产物文件里都没有）"
          else
            echo "::warning::未配置 TYW_SERVER_URL，本次产物为离线版"
          fi
          # 所有平台都不带 server.txt：逐个 tar.gz 复核
          for f in dist/*.tar.gz; do
            if tar -tzf "$f" | grep -q 'server\.txt$'; then
              echo "::error::$f 里出现了 server.txt"; exit 1
            fi
          done
          echo "已确认包内不含 server.txt"

          # 每种格式、每个通道都要有：2 通道 × 5 格式 = 10 个包
          echo "--- dist ---"
          ls -lh dist
          n_tar=$(ls dist/*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          n_deb=$(ls dist/*.deb 2>/dev/null | wc -l | tr -d ' ')
          n_rpm=$(ls dist/*.rpm 2>/dev/null | wc -l | tr -d ' ')
          n_pac=$(ls dist/*.pkg.tar.zst 2>/dev/null | wc -l | tr -d ' ')
          n_app=$(ls dist/*.AppImage 2>/dev/null | wc -l | tr -d ' ')
          echo "tar.gz=$n_tar deb=$n_deb rpm=$n_rpm pacman=$n_pac appimage=$n_app"
          for pair in "tar.gz:$n_tar" "deb:$n_deb" "rpm:$n_rpm" "pkg.tar.zst:$n_pac" "AppImage:$n_app"; do
            [ "${pair#*:}" -ge 2 ] || { echo "::error::缺少 ${pair%:*} 包"; exit 1; }
          done
          cp dist/SHA256SUMS "dist/SHA256SUMS-linux-${{ matrix.arch }}.txt"
          rm -f dist/SHA256SUMS

      # 逐种格式验证包是真能用的：deb 读控制段、rpm 读头、zst 读 .PKGINFO、
      # AppImage 解包看 AppRun 与主程序、tar.gz 看主程序在不在
      - name: Verify packages
        working-directory: TYWLauncher-Linux
        run: |
          set -e
          for f in dist/*.deb; do
            echo "--- $f"
            dpkg-deb -f "$f" Package Version Architecture
          done
          for f in dist/*.rpm; do
            echo "--- $f"
            rpm -qp --nosignature --qf '%{NAME} %{VERSION} %{RELEASE} %{ARCH}\n' "$f"
          done
          for f in dist/*.pkg.tar.zst; do
            echo "--- $f"
            zstd -dc "$f" | tar -xO .PKGINFO | grep -E '^(pkgname|pkgver|arch) '
          done
          for f in dist/*.tar.gz; do
            echo "--- $f"
            tar -tzf "$f" | grep -q '/TYWLauncher$'
          done
          for f in dist/*.AppImage; do
            echo "--- $f"
            app="$PWD/$f"
            rm -rf /tmp/ax && mkdir -p /tmp/ax
            ( cd /tmp/ax && "$app" --appimage-extract >/dev/null )
            test -x /tmp/ax/squashfs-root/AppRun
            test -f /tmp/ax/squashfs-root/usr/bin/TYWLauncher
            grep -q 'TYW_APPIMAGE=1' /tmp/ax/squashfs-root/AppRun
          done
          echo "全部格式校验通过"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TYWLauncher-linux-${{ matrix.arch }}
          path: TYWLauncher-Linux/dist/*
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TYWLauncher-Linux/dist/*
          generate_release_notes: true
