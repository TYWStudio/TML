name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      server_url:
        description: '临时覆盖服务端地址（一般留空；留空时用仓库 Secrets 里的 TYW_SERVER_URL）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    # 用同架构的 runner：AppImage 的打包工具是目标架构的二进制，交叉跑会 exec format error
    runs-on: ${{ matrix.runner }}
    # 服务端地址不写在仓库里：由仓库 Secrets 的 TYW_SERVER_URL 注入，
    # 手动触发时填的 server_url 优先（方便临时指向别的服务器）。
    env:
      TYW_SERVER_URL: ${{ github.event.inputs.server_url || secrets.TYW_SERVER_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            runner: ubuntu-24.04
          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # dpkg-deb 自带；rpm / zstd / mksquashfs 需要装
      - name: Install packaging tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm zstd squashfs-tools file
          for t in dpkg-deb rpmbuild zstd mksquashfs; do
            printf '%-12s %s\n' "$t" "$(command -v $t || echo 缺失)"
          done

      # 公开仓库只出正式版 + 快照版；内测版（Beta）只在本地用 build.py 构建
      - name: Publish channels
        working-directory: TYWLauncher-Linux/src
        run: |
          set -e
          for ch in Release Snapshot; do
            echo "::group::publish $ch"
            dotnet publish TYW.Desktop/TYW.Desktop.csproj \
              -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:TYWChannel=$ch \
              -o "../out/ch-$ch"
            echo "::endgroup::"
          done

      # 一次出全部 5 种包：tar.gz / deb / rpm / pkg.tar.zst / AppImage
      # 版本号直接从源码取（ModApp.vb 的 Release 分支），避免和客户端对不上
      - name: Package all formats
        working-directory: TYWLauncher-Linux
        run: |
          set -e
          VER="$(sed -n 's/.*Case Else : Return "\([0-9][0-9.]*\)".*/\1/p' src/TYW.Core/Base/ModApp.vb | head -1)"
          [ -n "$VER" ] || { echo '::error::读不到版本号'; exit 1; }
          echo "版本号：$VER"
          for ch in Release Snapshot; do
            echo "::group::package $ch"
            TYW_CHANNEL="$ch" TYW_SRC_DIR="$PWD/out/ch-$ch" \
              bash packaging/build.sh "$VER" ${{ matrix.arch }}
            echo "::endgroup::"
          done
          if [ -n "${TYW_SERVER_URL:-}" ]; then
            echo "已把服务端地址写进各包的 server.txt（地址本身不在仓库里）"
          else
            echo "::warning::未配置 TYW_SERVER_URL，本次产物为离线版"
          fi

          # 每种格式、每个通道都要有：2 通道 × 5 格式 = 10 个包
          echo "--- dist ---"
          ls -lh dist
          n_tar=$(ls dist/*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          n_deb=$(ls dist/*.deb 2>/dev/null | wc -l | tr -d ' ')
          n_rpm=$(ls dist/*.rpm 2>/dev/null | wc -l | tr -d ' ')
          n_pac=$(ls dist/*.pkg.tar.zst 2>/dev/null | wc -l | tr -d ' ')
          n_app=$(ls dist/*.AppImage 2>/dev/null | wc -l | tr -d ' ')
          echo "tar.gz=$n_tar deb=$n_deb rpm=$n_rpm pacman=$n_pac appimage=$n_app"
          for pair in "tar.gz:$n_tar" "deb:$n_deb" "rpm:$n_rpm" "pkg.tar.zst:$n_pac" "AppImage:$n_app"; do
            [ "${pair#*:}" -ge 2 ] || { echo "::error::缺少 ${pair%:*} 包"; exit 1; }
          done
          cp dist/SHA256SUMS "dist/SHA256SUMS-linux-${{ matrix.arch }}.txt"
          rm -f dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TYWLauncher-linux-${{ matrix.arch }}
          path: TYWLauncher-Linux/dist/*
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TYWLauncher-Linux/dist/*
          generate_release_notes: true
