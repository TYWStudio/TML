[package]
name = "hellorust"
version = "1.0.0"
edition = "2021"
description = "TML 扩展 API v1 的 Rust 示例"
license = "CC-BY-NC-4.0"
publish = false

[[bin]]
name = "tml_ext"
path = "src/main.rs"

[dependencies]
tml-ext = { path = "../../sdk/rust" }

# 扩展是独立子进程，产物越小越好
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
